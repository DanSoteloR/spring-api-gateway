spring.application.name=api-management-service

server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PSW}

spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PSW}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=${JWT_SECRET}