spring.application.name=smart-gateway-service

server.port=8080

spring.config.import=optional:file:.env[.properties]

info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security and traffic management

management.api.username=${GATEKEEPER_GATEWAY_USERNAME}
management.api.password=${GATEKEEPER_GATEWAY_PASSWORD}
management.api.base-url=${GATEKEEPER_MANAGEMENT_URL}

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC}
gateway.kafka.configuration-group=${GATEKEEPER_CONFIGURATION_GROUP}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer